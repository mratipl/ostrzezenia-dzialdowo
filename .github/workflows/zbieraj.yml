name: Zbieranie ostrzeżeń

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kolektor/**"
      - "szablony/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zbieranie
  cancel-in-progress: false

jobs:
  zbierz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publikacja.outputs.page_url }}

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_COMMIT || secrets.GITHUB_TOKEN }}

      - name: Przygotuj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt

      - name: Zbierz dane i zbuduj stronę
        run: python -m kolektor.main

      - name: Zapisz stan w repozytorium
        run: |
          git config user.name "kolektor"
          git config user.email "kolektor@users.noreply.github.com"
          git add public/dane.json
          if git diff --staged --quiet; then
            echo "Bez zmian w danych."
          else
            git commit -m "Aktualizacja danych: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Przygotuj artefakt strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Opublikuj na GitHub Pages
        id: publikacja
        uses: actions/deploy-pages@v4
